<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8" /> <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <title>AA Electronics | Login</title> <style> :root { --navy: #13243a; --blue: #1769aa; --bg: #f3f6fa; --line: #dce3eb; --green: #16834a; --red: #b73535; } * { box-sizing: border-box; } body { margin: 0; font: 15px Arial, sans-serif; background: var(--bg); color: #1d2937; } #authGate { position: fixed; inset: 0; background: var(--navy); display: flex; align-items: center; justify-content: center; z-index: 99999; padding: 16px; } .login-box { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 24px; width: 100%; max-width: 350px; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3); } .login-box h2 { margin: 0 0 6px; color: var(--navy); } .muted { color: #718096; font-size: 13px; } .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; } label { font-size: 13px; font-weight: 700; color: #526174; } input { width: 100%; padding: 10px; border: 1px solid #cbd5df; border-radius: 7px; font: inherit; } .btn { border: 0; border-radius: 8px; padding: 10px 14px; background: var(--blue); color: #fff; cursor: pointer; font-weight: 600; width: 100%; } .login-error { color: var(--red); font-size: 13px; margin-top: 10px; display: none; } .app { max-width: 1200px; margin: auto; padding: 16px; } .head { background: var(--navy); color: #fff; padding: 18px 20px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; } .head h1 { margin: 0; font-size: 24px; } .head small { color: #c8d5e3; } .logout-btn { width: auto; background: #52677d; padding: 8px 14px; } .panel { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-top: 14px; } </style> </head> <body> <div id="authGate"> <div class="login-box"> <h2>AA Electronics</h2> <p class="muted" style="margin:0 0 16px">Username এবং Password দিয়ে লগইন করুন</p> <div class="field"> <label for="authUser">Username</label> <input id="authUser" type="text" placeholder="AA" autocomplete="username" /> </div> <div class="field" style="margin-bottom:16px"> <label for="authPass">Password</label> <input id="authPass" type="password" placeholder="Password" autocomplete="current-password" /> </div> <button id="loginBtn" type="button" class="btn">Login</button> <div id="authMsg" class="login-error">ভুল Username বা Password!</div> </div> </div> <div id="mainApp" class="app" style="display:none"> <header class="head"> <div> <h1>AA Electronics</h1> <small>Invoice &amp; Stock Management System</small> </div> <button id="logoutBtn" type="button" class="btn logout-btn">Logout</button> </header> <div class="panel"> <h2>লগইন সফল হয়েছে</h2> <p class="muted">আপনার মূল Invoice &amp; Stock ড্যাশবোর্ড এখানে যুক্ত করা যাবে।</p> </div> </div> <script> (function () { const VALID_USER = "AA"; const VALID_PASS = "Farid@1234"; const gate = document.getElementById("authGate"); const app = document.getElementById("mainApp"); const userEl = document.getElementById("authUser"); const passEl = document.getElementById("authPass"); const msgEl = document.getElementById("authMsg"); const loginBtn = document.getElementById("loginBtn"); const logoutBtn = document.getElementById("logoutBtn"); function showApp() { gate.style.display = "none"; app.style.display = "block"; msgEl.style.display = "none"; } function showGate() { app.style.display = "none"; gate.style.display = "flex"; userEl.value = ""; passEl.value = ""; msgEl.style.display = "none"; } function handleLogin() { const u = (userEl.value || "").trim(); const p = passEl.value || ""; if (u === VALID_USER && p === VALID_PASS) { try { sessionStorage.setItem("aa_auth", "1"); } catch (e) {} showApp(); } else { msgEl.style.display = "block"; } } loginBtn.addEventListener("click", handleLogin); passEl.addEventListener("keydown", function (e) { if (e.key === "Enter") handleLogin(); }); logoutBtn.addEventListener("click", function () { try { sessionStorage.removeItem("aa_auth"); } catch (e) {} showGate(); }); try { if (sessionStorage.getItem("aa_auth") === "1") { showApp(); } } catch (e) {} })(); </script> </body> </html
